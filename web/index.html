<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Taskly - Manage your work tasks easily.">

  <!-- iOS / Mobile -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Taskly">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Taskly</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    #loading {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: #3f51b5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 48px;
      font-weight: bold;
    }

    .title {
      margin-top: 20px;
      font-size: 32px;
      font-weight: 700;
      color: #202124;
    }

    .subtitle {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="logo">✓</div>
    <div class="title">Taskly</div>
    <div class="subtitle">Manage your work. Stay organized.</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');

      if (loading) {
        loading.remove();
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
